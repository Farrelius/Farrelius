<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <defs>
    <style>text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }</style>
    <radialGradient id="repo_glow" cx="0%" cy="0%" r="70%">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="repo_vig" cx="50%" cy="50%" r="75%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="repo_shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d1117"    stop-opacity="1"/>
      <stop offset="40%"  stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117"    stop-opacity="1"/>
    </linearGradient>
    <clipPath id="repo_card"><rect width="300" height="150" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#repo_card)">
    <rect width="300" height="150" fill="#0d1117"/>
    <g stroke="#161b22" stroke-width="0.5" opacity="0.6">
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="20" y1="0" x2="20" y2="150"/>
      <line x1="40" y1="0" x2="40" y2="150"/>
      <line x1="60" y1="0" x2="60" y2="150"/>
      <line x1="80" y1="0" x2="80" y2="150"/>
      <line x1="100" y1="0" x2="100" y2="150"/>
      <line x1="120" y1="0" x2="120" y2="150"/>
      <line x1="140" y1="0" x2="140" y2="150"/>
      <line x1="160" y1="0" x2="160" y2="150"/>
      <line x1="180" y1="0" x2="180" y2="150"/>
      <line x1="200" y1="0" x2="200" y2="150"/>
      <line x1="220" y1="0" x2="220" y2="150"/>
      <line x1="240" y1="0" x2="240" y2="150"/>
      <line x1="260" y1="0" x2="260" y2="150"/>
      <line x1="280" y1="0" x2="280" y2="150"/>
      <line x1="300" y1="0" x2="300" y2="150"/>
      <line x1="0" y1="0" x2="300" y2="0"/>
      <line x1="0" y1="20" x2="300" y2="20"/>
      <line x1="0" y1="40" x2="300" y2="40"/>
      <line x1="0" y1="60" x2="300" y2="60"/>
      <line x1="0" y1="80" x2="300" y2="80"/>
      <line x1="0" y1="100" x2="300" y2="100"/>
      <line x1="0" y1="120" x2="300" y2="120"/>
      <line x1="0" y1="140" x2="300" y2="140"/>
    </g>
    <rect width="300" height="150" fill="url(#repo_glow)"/>
    <rect width="300" height="150" fill="url(#repo_vig)"/>
    <rect width="300" height="150" rx="12" fill="none" stroke="#21262d" stroke-width="1"/>
    <!-- shimmer top -->
    <rect x="30" y="0" width="240" height="1" fill="url(#repo_shimmer)" opacity="0.8"/>
    <!-- label -->
    <text x="20" y="26" fill="#8b949e" font-size="8" letter-spacing="2.5">TOP · REPOSITORY</text>
    <!-- repo name -->
    <text x="20" y="50" fill="#58a6ff" font-size="14" font-weight="700" letter-spacing="0.5">elry</text>
    <!-- description -->
    <text x="20" y="68" fill="#8b949e" font-size="9">Privacy-focused personality analysis platfor</text>
    <!-- divider -->
    <line x1="20" y1="80" x2="280" y2="80" stroke="#21262d" stroke-width="0.7"/>
    <!-- lang dot + label -->
    <circle cx="20" cy="101" r="4" fill="#58a6ff"/>
    <text x="30" y="102" fill="#c9d1d9" font-size="9" dominant-baseline="middle">TypeScript</text>
    <!-- star icon (★) -->
    <text x="130" y="102" fill="#8b949e" font-size="9" dominant-baseline="middle">★</text>
    <text x="144" y="102" fill="#c9d1d9" font-size="9" dominant-baseline="middle">0</text>
    <!-- fork icon -->
    <text x="175" y="102" fill="#8b949e" font-size="9" dominant-baseline="middle">⑂</text>
    <text x="189" y="102" fill="#c9d1d9" font-size="9" dominant-baseline="middle">0</text>
    <!-- bottom label -->
    <text x="284" y="139" fill="#30363d" font-size="7.5" text-anchor="end"
          letter-spacing="1.5" opacity="0.7">AUTO · UPDATED · 12H</text>
  </g>
</svg>